name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  payment-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: riskflow
          POSTGRES_PASSWORD: riskflow_ci
          POSTGRES_DB: riskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskflow -d riskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/payment-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: services/payment-api/go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Apply integration-test migrations
        shell: bash
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/database/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path=/migrations \
            -database="postgres://riskflow:riskflow_ci@localhost:5432/riskflow?sslmode=disable" \
            up

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgres://riskflow:riskflow_ci@localhost:5432/riskflow?sslmode=disable
        run: go test -tags=integration -count=1 -p=1 ./...

      - name: Build
        run: go build ./...
