name: riskflow1

services:
  postgres:
    image: postgres:17-alpine
    container_name: riskflow1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: riskflow1-migrate
    restart: "no"
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    container_name: riskflow1-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: riskflow1-kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_TOPIC:-payments.created} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${RISK_DECISIONS_TOPIC:-risk.decisions} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${RISK_INVALID_EVENTS_TOPIC:-risk.invalid-events} --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    container_name: riskflow1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-api:
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
      target: payment-api
    container_name: riskflow1-payment-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      HTTP_ADDR: :8080
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-1s}
      PAYMENT_CREATE_TIMEOUT: ${PAYMENT_CREATE_TIMEOUT:-3s}
      REVIEW_REQUEST_TIMEOUT: ${REVIEW_REQUEST_TIMEOUT:-3s}
      REVIEW_AUTH_CREDENTIALS_JSON: ${REVIEW_AUTH_CREDENTIALS_JSON}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  outbox-publisher:
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
      target: outbox-publisher
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-payments.created}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-250ms}
      OUTBOX_PUBLISH_TIMEOUT: ${OUTBOX_PUBLISH_TIMEOUT:-5s}
      OUTBOX_RETRY_MIN_BACKOFF: ${OUTBOX_RETRY_MIN_BACKOFF:-100ms}
      OUTBOX_RETRY_MAX_BACKOFF: ${OUTBOX_RETRY_MAX_BACKOFF:-5s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  risk-service:
    build:
      context: .
      dockerfile: services/risk-service/Dockerfile
    container_name: riskflow1-risk-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:19092
      PAYMENTS_TOPIC: ${KAFKA_TOPIC:-payments.created}
      RISK_DECISIONS_TOPIC: ${RISK_DECISIONS_TOPIC:-risk.decisions}
      RISK_INVALID_EVENTS_TOPIC: ${RISK_INVALID_EVENTS_TOPIC:-risk.invalid-events}
      RISK_CONSUMER_GROUP: ${RISK_CONSUMER_GROUP:-riskflow-risk-ensemble-v2}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-riskflow:risk:v1}
      RISK_POLL_TIMEOUT: ${RISK_POLL_TIMEOUT:-1}
      RISK_PUBLISH_TIMEOUT: ${RISK_PUBLISH_TIMEOUT:-5}
      RISK_RETRY_BACKOFF: ${RISK_RETRY_BACKOFF:-1}
      VELOCITY_WINDOW_SECONDS: ${VELOCITY_WINDOW_SECONDS:-300}
      EVENT_CACHE_TTL_SECONDS: ${EVENT_CACHE_TTL_SECONDS:-2592000}
      FEATURE_STATE_TTL_SECONDS: ${FEATURE_STATE_TTL_SECONDS:-2592000}
      HIGH_AMOUNT_MINOR: ${HIGH_AMOUNT_MINOR:-100000}
      EXTREME_AMOUNT_MINOR: ${EXTREME_AMOUNT_MINOR:-500000}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-40}
      BLOCK_THRESHOLD: ${BLOCK_THRESHOLD:-70}
      RISKY_MERCHANT_IDS: ${RISKY_MERCHANT_IDS:-}
      HIGH_RISK_COUNTRIES: ${HIGH_RISK_COUNTRIES:-}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-/app/artifacts/risk_model_xgb_synthetic_v1.json}
      ML_MODEL_METADATA_PATH: ${ML_MODEL_METADATA_PATH:-/app/artifacts/risk_model_xgb_synthetic_v1.metadata.json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  risk-decision-consumer:
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
      target: risk-decision-consumer
    container_name: riskflow1-risk-decision-consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      RISK_DECISIONS_TOPIC: ${RISK_DECISIONS_TOPIC:-risk.decisions}
      DECISION_CONSUMER_GROUP: ${DECISION_CONSUMER_GROUP:-riskflow-decision-persistence-v1}
      DECISION_AUTO_OFFSET_RESET: ${DECISION_AUTO_OFFSET_RESET:-earliest}
      DECISION_PROCESS_TIMEOUT: ${DECISION_PROCESS_TIMEOUT:-5s}
      DECISION_RETRY_BACKOFF: ${DECISION_RETRY_BACKOFF:-1s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  decision-reconciler:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
      target: decision-reconciler
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RECONCILIATION_GRACE_PERIOD: ${RECONCILIATION_GRACE_PERIOD:-30s}
      RECONCILIATION_TIMEOUT: ${RECONCILIATION_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully

  streaming-analytics:
    build:
      context: .
      dockerfile: services/streaming-analytics/Dockerfile
      target: runtime
    container_name: riskflow1-streaming-analytics
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:19092
      PAYMENTS_TOPIC: ${KAFKA_TOPIC:-payments.created}
      RISK_DECISIONS_TOPIC: ${RISK_DECISIONS_TOPIC:-risk.decisions}
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_OUTPUT_ROOT: ${SPARK_OUTPUT_ROOT:-/var/lib/riskflow/streaming/data}
      SPARK_CHECKPOINT_ROOT: ${SPARK_CHECKPOINT_ROOT:-/var/lib/riskflow/streaming/checkpoints}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-earliest}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:-5 seconds}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-10000}
    volumes:
      - streaming_data:/var/lib/riskflow/streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  streaming_data:
