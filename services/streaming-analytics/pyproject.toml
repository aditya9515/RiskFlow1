[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riskflow-streaming-analytics"
version = "0.1.0"
description = "Spark Structured Streaming lake ingestion for RiskFlow"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage==7.15.4",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
